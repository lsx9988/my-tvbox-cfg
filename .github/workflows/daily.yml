name: Daily Update

on:
  schedule:
    # 北京时间每 6 小时：02:00 / 08:00 / 14:00 / 20:00
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run update
        run: python scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ config.json README.md
          git diff --staged --quiet || git commit -m "daily update $(date -u +%Y-%m-%d)"
          git push
      # jsDelivr 对同一路径有最长 12 小时缓存且忽略 query 参数，主动清理，
      # 避免手机端长时间拉到旧配置
      - name: Purge jsDelivr cache
        if: always()
        run: |
          for f in output/config.json output/tvbox.json output/live_intl.txt; do
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
            echo "purged $f"
          done
