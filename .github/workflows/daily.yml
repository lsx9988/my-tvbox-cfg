name: 抓取直播台

on:
  schedule:
    # 北京时间每天 00:00（UTC 16:00）
    - cron: '0 16 * * *'
    # 北京时间每天 12:00（UTC 04:00）：补一次刷新，避免签名到晚上过期
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_live:
        description: '立即重抓直播台（平时每天自动刷新，此按钮仅用于不等明天）'
        type: boolean
        default: false
  # 改脚本或改本 workflow 后自动跑一次，省得手动点
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/daily.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 两次触发撞一起会 push 冲突，同一时间只跑一个
    concurrency:
      group: daily-update
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取直播台：准备直播源刷新
        id: gate
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          # 卫视走运营商公网转播，不稳定，每天都重抓；央视官网源也顺手每天校验一次
          echo "refresh=1" >> "$GITHUB_OUTPUT"
          echo "每天刷新直播源（触发=$TRIGGER）"
      - name: Install deps
        run: pip install requests
      - name: Run update
        env:
          REFRESH_LIVE: ${{ steps.gate.outputs.refresh }}
        run: python scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 才能把脚本删掉的旧文件（如 live_intl.txt、旧 tvbox.json）一并提交
          git add -A output/ README.md
          git add download.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily update $(date -u +%Y-%m-%d)"
          git push
      # jsDelivr 对同一路径有最长 12 小时缓存且忽略 query 参数，主动清理，
      # 避免手机端长时间拉到旧配置
      - name: Purge jsDelivr cache
        if: always()
        run: |
          for f in output/tvbox_new.json output/sites.json output/lives.json output/cctv_live.txt; do
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
            echo "purged $f"
          done
          # 等 CDN 节点同步
          sleep 30
