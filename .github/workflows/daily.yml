name: Daily Update

on:
  schedule:
    # 北京时间每天 03:00（UTC 19:00）
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force_live:
        description: '强制刷新直播源（平时只有北京时间周一自动刷新）'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 判断今天是否刷新直播源
        id: gate
        run: |
          BJ_WEEK=$(TZ=Asia/Shanghai date +%u)
          FORCE="${{ github.event.inputs.force_live }}"
          if [ "$FORCE" = "true" ] || [ "$BJ_WEEK" = "1" ]; then
            echo "refresh=1" >> "$GITHUB_OUTPUT"
            echo "今天刷新直播源（北京周${BJ_WEEK}）"
          else
            echo "refresh=0" >> "$GITHUB_OUTPUT"
            echo "今天不刷新直播源（北京周${BJ_WEEK}），沿用现有 cctv_live.txt"
          fi
      - name: Install deps
        run: pip install requests
      - name: Run update
        env:
          REFRESH_LIVE: ${{ steps.gate.outputs.refresh }}
        run: python scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 才能把脚本删掉的旧文件（如 live_intl.txt、旧 tvbox.json）一并提交
          git add -A output/ README.md
          [ -f download.html ] && git add download.html
          git diff --staged --quiet || git commit -m "daily update $(date -u +%Y-%m-%d)"
          git push
      # 更新完发一封汇总邮件；没配 Secret 时脚本自动跳过，不会让任务变红
      - name: 发送更新邮件
        if: always()
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          JOB_STATUS: ${{ job.status }}
        run: python scripts/notify_mail.py
      # jsDelivr 对同一路径有最长 12 小时缓存且忽略 query 参数，主动清理，
      # 避免手机端长时间拉到旧配置
      - name: Purge jsDelivr cache
        if: always()
        run: |
          for f in output/tvbox_new.json output/sites.json output/lives.json output/cctv_live.txt; do
            curl -sS --max-time 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
            echo "purged $f"
          done
          # 等 CDN 节点同步
          sleep 30
